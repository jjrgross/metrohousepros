<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Current Deals | Metro House Pros</title>
  <meta name="robots" content="noindex, nofollow" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy: #0f2557;
      --green: #22c55e;
      --green-dark: #16a34a;
      --light: #f8fafc;
      --border: #e2e8f0;
      --text: #1e293b;
      --muted: #64748b;
      --red: #ef4444;
      --yellow: #f59e0b;
      --card-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--light);
      color: var(--text);
      min-height: 100vh;
    }

    header {
      background: var(--navy);
      color: white;
      padding: 18px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    header .brand {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    header .brand span { color: var(--green); }

    header a {
      color: rgba(255,255,255,0.7);
      text-decoration: none;
      font-size: 0.85rem;
    }

    header a:hover { color: white; }

    .container { max-width: 1100px; margin: 0 auto; padding: 32px 20px; }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .subtitle { color: var(--muted); margin-bottom: 32px; font-size: 0.95rem; }

    /* === ADMIN PANEL === */
    .admin-panel {
      background: white;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 28px;
      margin-bottom: 40px;
      box-shadow: var(--card-shadow);
    }

    .admin-panel h2 {
      font-size: 1.15rem;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge-admin {
      font-size: 0.7rem;
      background: var(--navy);
      color: white;
      padding: 2px 8px;
      border-radius: 99px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .form-grid .full { grid-column: 1 / -1; }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.4px;
      margin-bottom: 5px;
    }

    input, select, textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 9px 12px;
      font-size: 0.92rem;
      color: var(--text);
      background: white;
      transition: border-color 0.15s;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--navy);
    }

    textarea { resize: vertical; min-height: 72px; }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 20px;
      border-radius: 7px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: opacity 0.15s, transform 0.1s;
    }

    .btn:hover { opacity: 0.88; }
    .btn:active { transform: scale(0.98); }

    .btn-primary { background: var(--green); color: white; }
    .btn-danger { background: var(--red); color: white; font-size: 0.8rem; padding: 6px 12px; }

    .form-actions { margin-top: 18px; }

    .msg {
      padding: 10px 14px;
      border-radius: 7px;
      font-size: 0.87rem;
      margin-top: 14px;
      display: none;
    }

    .msg.success { background: #dcfce7; color: #15803d; display: block; }
    .msg.error   { background: #fee2e2; color: #b91c1c; display: block; }

    /* === DEALS GRID === */
    .deals-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .deal-count { color: var(--muted); font-size: 0.9rem; }

    .deals-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
    }

    .deal-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: var(--card-shadow);
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .deal-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.1);
    }

    .deal-img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      background: #e2e8f0;
      display: block;
    }

    .deal-img-placeholder {
      width: 100%;
      height: 180px;
      background: linear-gradient(135deg, #1e3a8a 0%, #0f2557 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255,255,255,0.3);
      font-size: 2.5rem;
    }

    .deal-body { padding: 16px; }

    .deal-status {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 3px 10px;
      border-radius: 99px;
      margin-bottom: 10px;
    }

    .status-available { background: #dcfce7; color: #15803d; }
    .status-pending   { background: #fef3c7; color: #92400e; }
    .status-sold      { background: #fee2e2; color: #991b1b; }

    .deal-address {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 4px;
      line-height: 1.3;
    }

    .deal-price {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--navy);
      margin-bottom: 8px;
    }

    .deal-specs {
      display: flex;
      gap: 14px;
      color: var(--muted);
      font-size: 0.82rem;
      margin-bottom: 10px;
    }

    .deal-description {
      font-size: 0.85rem;
      color: var(--muted);
      line-height: 1.5;
      margin-bottom: 12px;
    }

    .deal-date {
      font-size: 0.75rem;
      color: #94a3b8;
    }

    .deal-card-admin-bar {
      padding: 10px 16px;
      border-top: 1px solid var(--border);
      background: #fafafa;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }

    .empty-state .icon { font-size: 3rem; margin-bottom: 12px; }
    .empty-state p { font-size: 0.95rem; }

    .loading {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }

    @media (max-width: 600px) {
      .form-grid { grid-template-columns: 1fr; }
      .form-grid .full { grid-column: 1; }
      h1 { font-size: 1.4rem; }
    }
  </style>
</head>
<body>

<header>
  <div class="brand">Metro House <span>Pros</span></div>
  <a href="/">metrohousepros.com</a>
</header>

<div class="container">
  <h1>Current Deals</h1>
  <p class="subtitle">Properties available from Metro House Pros LLC</p>

  <!-- Admin panel — hidden unless ?manage=metro99 -->
  <div class="admin-panel" id="adminPanel" style="display:none">
    <h2>Add New Deal <span class="badge-admin">Admin</span></h2>
    <form id="dealForm">
      <div class="form-grid">
        <div class="full">
          <label>Property Address *</label>
          <input type="text" id="address" placeholder="123 Main St, Kenosha, WI 53140" required />
        </div>
        <div>
          <label>Asking Price *</label>
          <input type="text" id="price" placeholder="$149,000" required />
        </div>
        <div>
          <label>Status</label>
          <select id="status">
            <option value="Available">Available</option>
            <option value="Pending">Pending</option>
            <option value="Sold">Sold</option>
          </select>
        </div>
        <div>
          <label>Beds</label>
          <input type="text" id="beds" placeholder="3" />
        </div>
        <div>
          <label>Baths</label>
          <input type="text" id="baths" placeholder="2" />
        </div>
        <div>
          <label>Sq Ft</label>
          <input type="text" id="sqft" placeholder="1,400" />
        </div>
        <div class="full">
          <label>Photo URL (optional)</label>
          <input type="url" id="imageUrl" placeholder="https://..." />
        </div>
        <div class="full">
          <label>Description (optional)</label>
          <textarea id="description" placeholder="Great investment opportunity, recently renovated..."></textarea>
        </div>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary">+ Add Deal</button>
      </div>
      <div class="msg" id="formMsg"></div>
    </form>
  </div>

  <!-- Deals list -->
  <div class="deals-header">
    <div id="dealCount" class="deal-count"></div>
  </div>

  <div id="dealsList">
    <div class="loading">Loading deals...</div>
  </div>
</div>

<script>
  const isAdmin = new URLSearchParams(location.search).get('manage') === 'metro99';
  const API = '/api/deals';
  const adminQS = isAdmin ? '?manage=metro99' : '';

  if (isAdmin) {
    document.getElementById('adminPanel').style.display = 'block';
  }

  function statusClass(s) {
    if (s === 'Available') return 'status-available';
    if (s === 'Pending')   return 'status-pending';
    return 'status-sold';
  }

  function formatDate(iso) {
    return new Date(iso).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  }

  function renderDeals(deals) {
    const list = document.getElementById('dealsList');
    const count = document.getElementById('dealCount');

    count.textContent = deals.length === 0 ? '' : `${deals.length} propert${deals.length === 1 ? 'y' : 'ies'}`;

    if (deals.length === 0) {
      list.innerHTML = `
        <div class="empty-state">
          <div class="icon">🏠</div>
          <p>No deals available right now. Check back soon!</p>
        </div>`;
      return;
    }

    list.innerHTML = `<div class="deals-grid">${deals.map(d => `
      <div class="deal-card" id="card-${d.id}">
        ${d.imageUrl
          ? `<img class="deal-img" src="${escHtml(d.imageUrl)}" alt="${escHtml(d.address)}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'" /><div class="deal-img-placeholder" style="display:none">🏠</div>`
          : `<div class="deal-img-placeholder">🏠</div>`}
        <div class="deal-body">
          <div class="deal-status ${statusClass(d.status)}">${escHtml(d.status)}</div>
          <div class="deal-address">${escHtml(d.address)}</div>
          <div class="deal-price">${escHtml(d.price)}</div>
          ${(d.beds || d.baths || d.sqft) ? `
            <div class="deal-specs">
              ${d.beds  ? `<span>🛏 ${escHtml(d.beds)} bed</span>` : ''}
              ${d.baths ? `<span>🚿 ${escHtml(d.baths)} bath</span>` : ''}
              ${d.sqft  ? `<span>📐 ${escHtml(d.sqft)} sqft</span>` : ''}
            </div>` : ''}
          ${d.description ? `<div class="deal-description">${escHtml(d.description)}</div>` : ''}
          <div class="deal-date">Added ${formatDate(d.createdAt)}</div>
        </div>
        ${isAdmin ? `
          <div class="deal-card-admin-bar">
            <button class="btn btn-danger" onclick="deleteDeal('${d.id}')">Delete</button>
          </div>` : ''}
      </div>`).join('')}
    </div>`;
  }

  function escHtml(str) {
    return String(str || '')
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  async function loadDeals() {
    try {
      const res = await fetch(API);
      const deals = await res.json();
      renderDeals(deals);
    } catch {
      document.getElementById('dealsList').innerHTML =
        '<div class="empty-state"><div class="icon">⚠️</div><p>Could not load deals. Please try again.</p></div>';
    }
  }

  async function deleteDeal(id) {
    if (!confirm('Delete this deal?')) return;
    const res = await fetch(`${API}?manage=metro99&id=${id}`, { method: 'DELETE' });
    if (res.ok) {
      document.getElementById(`card-${id}`)?.remove();
      const remaining = document.querySelectorAll('.deal-card').length;
      document.getElementById('dealCount').textContent = remaining
        ? `${remaining} propert${remaining === 1 ? 'y' : 'ies'}`
        : '';
      if (!remaining) loadDeals();
    } else {
      alert('Failed to delete deal.');
    }
  }

  document.getElementById('dealForm')?.addEventListener('submit', async (e) => {
    e.preventDefault();
    const msg = document.getElementById('formMsg');
    msg.className = 'msg';
    msg.textContent = '';

    const payload = {
      address:     document.getElementById('address').value.trim(),
      price:       document.getElementById('price').value.trim(),
      beds:        document.getElementById('beds').value.trim(),
      baths:       document.getElementById('baths').value.trim(),
      sqft:        document.getElementById('sqft').value.trim(),
      status:      document.getElementById('status').value,
      imageUrl:    document.getElementById('imageUrl').value.trim(),
      description: document.getElementById('description').value.trim(),
    };

    try {
      const res = await fetch(`${API}?manage=metro99`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });

      if (res.ok) {
        msg.textContent = 'Deal added successfully!';
        msg.className = 'msg success';
        e.target.reset();
        loadDeals();
        setTimeout(() => { msg.className = 'msg'; }, 3000);
      } else {
        const err = await res.json();
        msg.textContent = err.error || 'Failed to add deal.';
        msg.className = 'msg error';
      }
    } catch {
      msg.textContent = 'Network error. Please try again.';
      msg.className = 'msg error';
    }
  });

  loadDeals();
</script>
</body>
</html>
